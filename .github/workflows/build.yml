# Custom build of Dictate Keyboard (back-gesture fix).
# Builds the `benchmark` build type: release-optimised (R8), applicationId
# net.devemperor.dictate.bench, signed with the debug signing config whose keystore
# comes from the DEBUG_KEYSTORE_B64 secret so every rebuild installs as an update.
name: Build custom APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (default: v<version>-custom.<run number>)"
        required: false
        default: ""
  push:
    branches: [custom]

permissions:
  contents: write

env:
  DEBUG_KEYSTORE_PATH: /home/runner/.android/debug.keystore

concurrency:
  group: build-custom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore from secret
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_B64}" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is missing"; exit 1
          fi
          mkdir -p "$(dirname "$DEBUG_KEYSTORE_PATH")"
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$DEBUG_KEYSTORE_PATH"
          keytool -list -keystore "$DEBUG_KEYSTORE_PATH" -storepass android -alias androiddebugkey >/dev/null
          echo "debug.keystore restored to $DEBUG_KEYSTORE_PATH"

      - name: Fetch sherpa-onnx native libraries
        run: bash tools/fetch-sherpa-onnx.sh

      # The tag is decided before the build so the APK knows which release it is (the in-app
      # updater compares it with the newest release on GitHub).
      - name: Decide release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          VERSION=$(grep '^projectVersionName=' gradle.properties | cut -d= -f2)
          TAG="${INPUT_TAG:-v${VERSION}-custom.${{ github.run_number }}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Runner resources
        run: |
          nproc; free -h; df -h / | tail -n1

      # Private-repo runners have 2 vCPU / 7 GB, so the heap in gradle.properties (6 GB) plus a
      # separate Kotlin daemon can get the job killed. Override on the command line instead of
      # editing gradle.properties, keep the compiler in-process, and skip lintVital (6+ min of
      # release-lint checks that only matter for a Play upload).
      - name: Build benchmark APK
        env:
          CUSTOM_UPDATE_REPO: ${{ github.repository }}
          CUSTOM_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ./gradlew :app:assembleBenchmark --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.workers.max=2 \
            -x :app:lintVitalAnalyzeBenchmark -x :app:lintVitalReportBenchmark -x :app:lintVitalBenchmark

      - name: Inspect APK
        id: inspect
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=$(ls app/build/outputs/apk/benchmark/*.apk | head -n1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "## APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|application-label:" | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "SHA-256|Verified" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Hard checks: must be the side-by-side package with the custom label.
          "$BT/aapt2" dump badging "$APK" | grep -q "^package: name='net.devemperor.dictate.bench'"
          "$BT/aapt2" dump badging "$APK" | grep -q "application-label:'Dictate (Custom)'"
          # The APK must be signed with the restored keystore, not a key AGP minted on the runner.
          EXPECTED=$(keytool -list -v -keystore "$DEBUG_KEYSTORE_PATH" -storepass android -alias androiddebugkey \
            | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "expected cert $EXPECTED / actual cert $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::APK signed with the wrong key"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictate-custom-apk
          path: app/build/outputs/apk/benchmark/*.apk
          if-no-files-found: error

      - name: Create GitHub release (pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          APK="${{ steps.inspect.outputs.apk }}"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES=$(printf '%s\n' \
            "Custom build of Dictate Keyboard ${{ steps.tag.outputs.version }} (commit ${GITHUB_SHA::7})." \
            "" \
            "Package: net.devemperor.dictate.bench (installs alongside the Play Store app). No API keys or secrets are in this repo or APK." \
            "Label: Dictate (Custom)" \
            "SHA-256: ${SHA}" \
            "" \
            "Changes vs upstream: 'Allow system back gesture over keyboard' setting (Gestures > Other gestures, on by default); in-app updater under Settings > Updates (custom build); offline translation library not bundled.")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --prerelease --target "$GITHUB_SHA" \
              --title "Dictate (Custom) $TAG" --notes "$NOTES"
          fi
          echo "Release: $(gh release view "$TAG" --json url --jq .url)" | tee -a "$GITHUB_STEP_SUMMARY"
